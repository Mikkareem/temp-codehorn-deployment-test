apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-java-execution-service
  labels:
    app: {{ .Release.Name }}-java-execution-service
spec:
  replicas: {{ .Values.java.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-java-execution-service
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-java-execution-service
    spec:
      containers:
        # Main Java Execution Service Container
        - name: main
          image: "{{ .Values.java.image.repository }}:{{ .Values.java.image.tag }}"
          imagePullPolicy: {{ .Values.java.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.java.service.port }}
              protocol: TCP
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          volumeMounts:
            - name: shared-workspace
              mountPath: /workspace
          resources:
            {{- toYaml .Values.java.resources | nindent 12 }}

        # Docker in Docker (DinD) Sidecar Container
        - name: dind-sidecar
          image: "{{ .Values.java.sidecar.image.repository }}:{{ .Values.java.sidecar.image.tag }}"
          imagePullPolicy: {{ .Values.java.sidecar.image.pullPolicy }}
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: shared-workspace
              mountPath: /workspace
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - docker image inspect {{ .Values.java.sidecar.runnerImage }} >/dev/null 2>&1
            initialDelaySeconds: 5
            periodSeconds: 5
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    until docker info >/dev/null 2>&1; do
                      sleep 1
                    done
                    docker pull {{ .Values.java.sidecar.runnerImage }}
      volumes:
        - name: shared-workspace
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-java-execution-service
  labels:
    app: {{ .Release.Name }}-java-execution-service
spec:
  type: {{ .Values.java.service.type }}
  ports:
    - port: {{ .Values.java.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Release.Name }}-java-execution-service
