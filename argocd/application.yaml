apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: codehorn-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mikkareem/temp-codehorn-deployment-test
    targetRevision: HEAD
    path: helm # deployments/kubernetes/helm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: codehorn-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
