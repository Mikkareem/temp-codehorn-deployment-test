{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway-service
  labels:
    app: {{ .Release.Name }}-gateway-service
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-gateway-service
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-gateway-service
    spec:
      containers:
        # Main Gateway Service Container
        - name: main
          image: "{{ .Values.gateway.image.repository }}{{ if eq .Values.gateway.image.sha \"\" }}:latest{{ else }}@{{ .Values.gateway.image.sha }}{{ end }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}
              protocol: TCP
          env:
            - name: SPRING_APPLICATION_NAME
              value: "gateway-service"
            - name: SERVER_PORT
              value: "{{ .Values.gateway.service.port }}"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health"
            {{- if .Values.consul.enabled }}
            - name: SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME
              value: "{{ .Release.Name }}-gateway-service"
            - name: SPRING_CLOUD_CONSUL_DISCOVERY_PORT
              value: "{{ .Values.gateway.service.port }}"
            - name: SPRING_CLOUD_CONSUL_DISCOVERY_HEALTH_CHECK_PATH
              value: "/actuator/health"
            - name: SPRING_CLOUD_CONSUL_DISCOVERY_HEALTH_CHECK_INTERVAL
              value: "10s"
            {{- else }}
            - name: SPRING_CLOUD_CONSUL_ENABLED
              value: "false"
            {{- end }}
          {{- if .Values.consul.enabled }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-consul-config
          {{- end }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway-service
  labels:
    app: {{ .Release.Name }}-gateway-service
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Release.Name }}-gateway-service
{{- end }}
