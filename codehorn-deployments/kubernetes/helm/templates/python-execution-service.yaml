{{- if .Values.python.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-python-execution-service
  labels:
    app: {{ .Release.Name }}-python-execution-service
spec:
  replicas: {{ .Values.python.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-python-execution-service
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-python-execution-service
    spec:
      containers:
        # Main Python Execution Service Container
        - name: main
          image: "{{ .Values.python.image.repository }}{{ if eq .Values.python.image.sha \"\" }}:latest{{ else }}@{{ .Values.python.image.sha }}{{ end }}"
          imagePullPolicy: {{ .Values.python.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.python.service.port }}
              protocol: TCP
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
            - name: SPRING_APPLICATION_NAME
              value: "python-execution-service"
            - name: SERVER_PORT
              value: "{{ .Values.python.service.port }}"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health"
            {{- if .Values.consul.enabled }}
            - name: SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME
              value: "{{ .Release.Name }}-python-execution-service"
            - name: SPRING_CLOUD_CONSUL_DISCOVERY_PORT
              value: "{{ .Values.python.service.port }}"
            - name: SPRING_CLOUD_CONSUL_DISCOVERY_HEALTH_CHECK_PATH
              value: "/actuator/health"
            - name: SPRING_CLOUD_CONSUL_DISCOVERY_HEALTH_CHECK_INTERVAL
              value: "10s"
            {{- else }}
            - name: SPRING_CLOUD_CONSUL_ENABLED
              value: "false"
            {{- end }}
          {{- if .Values.consul.enabled }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-consul-config
          {{- end }}
          volumeMounts:
            - name: shared-workspace
              mountPath: /workspace
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - docker image inspect {{ .Values.python.sidecar.runnerImage }} >/dev/null 2>&1
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.python.resources | nindent 12 }}

        # Docker in Docker (DinD) Sidecar Container
        - name: dind-sidecar
          image: "{{ .Values.python.sidecar.image.repository }}:{{ .Values.python.sidecar.image.tag }}"
          imagePullPolicy: {{ .Values.python.sidecar.image.pullPolicy }}
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: shared-workspace
              mountPath: /workspace
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - docker image inspect {{ .Values.python.sidecar.runnerImage }} >/dev/null 2>&1
            initialDelaySeconds: 5
            periodSeconds: 5
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    until docker info >/dev/null 2>&1; do
                      sleep 5
                    done
                    docker pull {{ .Values.python.sidecar.runnerImage }}
      volumes:
        - name: shared-workspace
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-python-execution-service
  labels:
    app: {{ .Release.Name }}-python-execution-service
spec:
  type: {{ .Values.python.service.type }}
  ports:
    - port: {{ .Values.python.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Release.Name }}-python-execution-service
{{- end }}
