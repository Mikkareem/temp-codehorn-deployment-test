# Default values for Codehorn Execution Services.

global:
  environment: production
  cloudsqlUrl: "jdbc:mysql://cloudsql-proxy-service.sql-proxy.svc.cluster.local:3306"
# Common configurations
common:
  restartPolicy: Always
# C++ Execution Service
cpp:
  enabled: true
  replicaCount: 1
  image:
    repository: irsathkareem/codehorn-cpp-execution-service
    pullPolicy: IfNotPresent
    sha: "sha256:b9322f6754a4e69fd7d05fe923185948e71d49a72ec741584b617f86364d81ca"
  sidecar:
    image:
      repository: docker
      tag: "24.0.7-dind"
      pullPolicy: IfNotPresent
    runnerImage: "gcc:13"
  service:
    type: ClusterIP
    port: 80
  resources: {}
