name: AWS Terraform Destroy

on:
  workflow_dispatch:

jobs:
  terraform-destroy:
    name: AWS Terraform Destroy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Deployer Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/codehorn-terraform-deployer
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init
        working-directory: codehorn-deployments/kubernetes/terraform-aws
        run: terraform init

      - name: Terraform Destroy
        working-directory: codehorn-deployments/kubernetes/terraform-aws
        run: terraform destroy -auto-approve
