name: Terraform Apply

on:
  workflow_dispatch:

jobs:
  terraform-apply:
    name: Terraform Apply and Verify
    runs-on: ubuntu-latest
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Bootstrap)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.BOOTSTRAP_TERRAFORM_SERVICE_ACCOUNT_JSON }}

      - name: Create GKE Deployer SA Key
        run: |
          gcloud iam service-accounts keys create ${{ github.workspace }}/temp-key.json \
            --iam-account="codehorn-terraform-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          KEY_ID=$(jq -r '.private_key_id' ${{ github.workspace }}/temp-key.json)
          echo "KEY_ID=$KEY_ID" >> $GITHUB_ENV
          echo "Waiting for IAM propagation..."
          sleep 15

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init
        working-directory: codehorn-deployments/kubernetes/terraform
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/temp-key.json
        run: terraform init

      - name: Terraform Plan
        working-directory: codehorn-deployments/kubernetes/terraform
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/temp-key.json
        run: terraform plan

      - name: Terraform Apply
        working-directory: codehorn-deployments/kubernetes/terraform
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/temp-key.json
        run: terraform apply -auto-approve

      - name: Verify Argo CD UI Accessibility
        working-directory: codehorn-deployments/kubernetes/terraform
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/temp-key.json
        run: |
          # Get Nginx IP and decode password
          NGINX_IP=$(terraform output -raw nginx_url)
          PASSWORD=$(terraform output -raw argocd_initial_admin_password)
          
          echo "=== Deployment Details ==="
          echo "Argo CD UI URL: http://${NGINX_IP}"
          echo "Initial Admin Password: ${PASSWORD}"
          echo "=========================="
          
          # Wait and test connection
          echo "Testing accessibility to Argo CD UI via Nginx Gateway..."
          for i in {1..30}; do
            if curl -s -f -o /dev/null "http://${NGINX_IP}"; then
              echo "Argo CD UI is accessible via Nginx!"
              exit 0
            fi
            echo "Waiting for Nginx Gateway / Argo CD to be accessible... (attempt $i/30)"
            sleep 5
          done
          
          echo "Error: Argo CD UI is not accessible after 5 minutes"
          exit 1

      - name: Clean up GKE Deployer SA Key
        if: always()
        run: |
          if [ ! -z "$KEY_ID" ]; then
            gcloud iam service-accounts keys delete "$KEY_ID" \
              --iam-account="codehorn-terraform-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" --quiet
          fi
