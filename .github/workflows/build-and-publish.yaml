name: Build and Publish Services

on:
  workflow_dispatch:
    inputs:
      gateway-service:
        description: 'Build & Publish gateway-service'
        type: boolean
        default: false
      auth-service:
        description: 'Build & Publish auth-service'
        type: boolean
        default: false
      problems-service:
        description: 'Build & Publish problems-service'
        type: boolean
        default: false
      problem-submission-service:
        description: 'Build & Publish problem-submission-service'
        type: boolean
        default: false
      contest-service:
        description: 'Build & Publish contest-service'
        type: boolean
        default: false
      daily-challenge-service:
        description: 'Build & Publish daily-challenge-service'
        type: boolean
        default: false
      code-submission-service:
        description: 'Build & Publish code-submission-service'
        type: boolean
        default: false
      code-execution-service:
        description: 'Build & Publish code-execution-service'
        type: boolean
        default: false
      cpp-execution-service:
        description: 'Build & Publish cpp-execution-service'
        type: boolean
        default: false
      java-execution-service:
        description: 'Build & Publish java-execution-service'
        type: boolean
        default: false
      python-execution-service:
        description: 'Build & Publish python-execution-service'
        type: boolean
        default: false
      javascript-execution-service:
        description: 'Build & Publish javascript-execution-service'
        type: boolean
        default: false

jobs:
  determine-services:
    name: Determine Services to Build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_services: ${{ steps.set-matrix.outputs.has_services }}
    steps:
      - name: Create Service List
        id: set-matrix
        run: |
          SERVICES=()
          if [ "${{ inputs.gateway-service }}" = "true" ]; then SERVICES+=("gateway-service"); fi
          if [ "${{ inputs.auth-service }}" = "true" ]; then SERVICES+=("auth-service"); fi
          if [ "${{ inputs.problems-service }}" = "true" ]; then SERVICES+=("problems-service"); fi
          if [ "${{ inputs.problem-submission-service }}" = "true" ]; then SERVICES+=("problem-submission-service"); fi
          if [ "${{ inputs.contest-service }}" = "true" ]; then SERVICES+=("contest-service"); fi
          if [ "${{ inputs.daily-challenge-service }}" = "true" ]; then SERVICES+=("daily-challenge-service"); fi
          if [ "${{ inputs.code-submission-service }}" = "true" ]; then SERVICES+=("code-submission-service"); fi
          if [ "${{ inputs.code-execution-service }}" = "true" ]; then SERVICES+=("code-execution-service"); fi
          if [ "${{ inputs.cpp-execution-service }}" = "true" ]; then SERVICES+=("cpp-execution-service"); fi
          if [ "${{ inputs.java-execution-service }}" = "true" ]; then SERVICES+=("java-execution-service"); fi
          if [ "${{ inputs.python-execution-service }}" = "true" ]; then SERVICES+=("python-execution-service"); fi
          if [ "${{ inputs.javascript-execution-service }}" = "true" ]; then SERVICES+=("javascript-execution-service"); fi

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "has_services=false" >> $GITHUB_OUTPUT
          else
            # Convert to JSON array
            JSON_ARRAY=$(echo "${SERVICES[@]}" | jq -R -c 'split(" ")')
            echo "matrix=${JSON_ARRAY}" >> $GITHUB_OUTPUT
            echo "has_services=true" >> $GITHUB_OUTPUT
          fi

  build-services:
    name: Build Services
    needs: determine-services
    if: ${{ needs.determine-services.outputs.has_services == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJson(needs.determine-services.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Gradle Wrapper Distribution URL
        run: |
          yq -i -p=properties -o=properties '.distributionUrl = "https://services.gradle.org/distributions/gradle-9.5.1-all.zip"' codehorn-backend/gradle/wrapper/gradle-wrapper.properties

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Project Version
        id: get_version
        run: |
          VERSION=$(grep -oE "version = \"[^\"]+\"" codehorn-backend/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and Cache Service Image
        uses: docker/build-push-action@v5
        with:
          context: codehorn-backend
          file: codehorn-backend/Dockerfiles/${{ matrix.service }}.Dockerfile
          tags: codehorn-${{ matrix.service }}:${{ steps.get_version.outputs.version }}
          outputs: type=docker,dest=/tmp/${{ matrix.service }}.tar
          build-args: |
            CODEHORN_APP_VERSION=${{ steps.get_version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  publish-services:
    name: Publish Services
    needs: [determine-services, build-services]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.determine-services.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Gradle Wrapper Distribution URL
        run: |
          yq -i -p=properties -o=properties '.distributionUrl = "https://services.gradle.org/distributions/gradle-9.5.1-all.zip"' codehorn-backend/gradle/wrapper/gradle-wrapper.properties

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          
      - name: Extract Project Version
        id: get_version
        run: |
          VERSION=$(grep -oE "version = \"[^\"]+\"" codehorn-backend/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/image-${{ matrix.service }}

      - name: Load, Tag and Push Image
        id: push_image
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          DOCKER_USER=${{ vars.DOCKERHUB_USERNAME }}
          
          # Load the image
          docker load -i /tmp/image-${{ matrix.service }}/${{ matrix.service }}.tar
          
          # Tag
          docker tag codehorn-${{ matrix.service }}:${VERSION} ${DOCKER_USER}/codehorn-${{ matrix.service }}:${VERSION}
          docker tag codehorn-${{ matrix.service }}:${VERSION} ${DOCKER_USER}/codehorn-${{ matrix.service }}:latest
          
          # Push
          docker push ${DOCKER_USER}/codehorn-${{ matrix.service }}:${VERSION}
          docker push ${DOCKER_USER}/codehorn-${{ matrix.service }}:latest
          
          # Get digest SHA
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${DOCKER_USER}/codehorn-${{ matrix.service }}:${VERSION} | cut -d'@' -f2)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Save and Print Image Digest SHA
        run: |
          echo "Successfully published codehorn-${{ matrix.service }}!"
          echo "Image SHA Digest: ${{ steps.push_image.outputs.digest }}"
          mkdir -p digest-out
          echo "${{ steps.push_image.outputs.digest }}" > digest-out/digest.txt

      - name: Upload Digest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}
          path: digest-out/digest.txt

  update-gitops:
    name: Update GitOps Helm Values
    needs: publish-services
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: digests

      - name: Update Helm values.yaml using yq
        run: |
          ls -R digests/
          for service_dir in digests/digest-*; do
            if [ -d "$service_dir" ]; then
              service_name=$(basename "$service_dir" | sed 's/digest-//')
              digest=$(cat "$service_dir"/digest.txt)
              
              case "$service_name" in
                gateway-service) key="gateway" ;;
                auth-service) key="auth" ;;
                problems-service) key="problems" ;;
                problem-submission-service) key="problemSubmission" ;;
                contest-service) key="contest" ;;
                daily-challenge-service) key="dailyChallenge" ;;
                code-submission-service) key="codeSubmission" ;;
                code-execution-service) key="codeExecution" ;;
                cpp-execution-service) key="cpp" ;;
                java-execution-service) key="java" ;;
                python-execution-service) key="python" ;;
                javascript-execution-service) key="javascript" ;;
                *) echo "Unknown service: $service_name"; continue ;;
              esac
              
              echo "Updating $service_name -> .$key.image.sha with $digest"
              yq -i ".${key}.image.sha = \"${digest}\"" codehorn-deployments/kubernetes/helm/values.yaml
            fi
          done

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add codehorn-deployments/kubernetes/helm/values.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update image digests [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
