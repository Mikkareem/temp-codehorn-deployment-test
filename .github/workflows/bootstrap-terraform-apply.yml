name: Bootstrap Terraform Apply

on:
  workflow_dispatch:

jobs:
  bootstrap-apply:
    name: Bootstrap Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.BOOTSTRAP_TERRAFORM_SERVICE_ACCOUNT_JSON }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init
        working-directory: init-terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: init-terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: init-terraform
        run: terraform apply -auto-approve
