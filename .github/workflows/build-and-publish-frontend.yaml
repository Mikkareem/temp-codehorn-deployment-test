name: Build and Publish Frontend App

on:
  push:
    paths:
      - 'codehorn-frontend/**'
      - '.github/workflows/build-and-publish-frontend.yaml'
  workflow_dispatch:

jobs:
  frontend-publish:
    name: Build and Publish Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract Frontend Version
        id: get_version
        run: |
          VERSION=$(node -e "console.log(require('./codehorn-frontend/package.json').version || 'latest')")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and Push Frontend Image
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: codehorn-frontend
          file: codehorn-frontend/deployment/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/codehorn-app:${{ steps.get_version.outputs.version }}
            ${{ vars.DOCKERHUB_USERNAME }}/codehorn-app:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Save Digest to File
        run: |
          mkdir -p digest-out
          echo "${{ steps.build_push.outputs.digest }}" > digest-out/digest.txt

      - name: Upload Digest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-frontend
          path: digest-out/digest.txt
  
  update-gitops:
    name: Update GitOps Helm Values
    needs: frontend-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Digest Artifact
        uses: actions/download-artifact@v4
        with:
          name: digest-frontend
          path: digest-out
      
      - name: Update Helm values.yaml using yq
        run: |
          digest=$(cat digest-out/digest.txt)
          echo "Updating frontend.image.sha with $digest"
          yq -i ".frontend.image.sha = \"${digest}\"" codehorn-deployments/kubernetes/helm/values.yaml

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add codehorn-deployments/kubernetes/helm/values.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update frontend image digest [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi